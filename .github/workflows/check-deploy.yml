# 검사 -> 통과했을 때만 배포. PR에서는 검사만 돈다.
name: check-deploy

on:
  pull_request:            # PR을 열면 검사만 한다 (배포 안 함)
  push:
    branches: [main]       # main에 병합되면 검사 후 배포
  workflow_dispatch:       # Actions 탭의 Run workflow로 수동 실행
  schedule:                # 매일 아침 한국 시각 07:17 (정각은 붐벼서 17분으로 비껴 잡음)
    - cron: "17 7 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.result.outputs.passed }}
      total: ${{ steps.result.outputs.total }}
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v7
      - name: Node 준비
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: 검사표 10줄 돌리기 (하나라도 다르면 여기서 실패)
        run: node tests/check.js
        env:
          CHECK_OUT: ${{ runner.temp }}/check-result.json
      - name: 검사 결과 숫자 읽기
        id: result
        run: |
          echo "passed=$(jq -r .passed "$RUNNER_TEMP/check-result.json")" >> "$GITHUB_OUTPUT"
          echo "total=$(jq -r .total "$RUNNER_TEMP/check-result.json")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check                                   # 검사가 통과해야만 실행
    if: github.event_name != 'pull_request'        # PR에서는 배포하지 않음
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v7
      - name: 화면에 보일 갱신 정보 파일 만들기
        run: |
          SHA7="${GITHUB_SHA::7}"
          NOW="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          printf '{"updated":"%s","passed":%s,"total":%s,"sha":"%s"}\n' "$NOW" "${{ needs.check.outputs.passed }}" "${{ needs.check.outputs.total }}" "$SHA7" > docs/build-info.json
          cat docs/build-info.json
      - name: Pages 설정 확인
        uses: actions/configure-pages@v6
      - name: docs 폴더를 배포 꾸러미로 묶기
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: 사이트에 올리기
        id: deployment
        uses: actions/deploy-pages@v5
